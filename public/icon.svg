      <feComposite in="SourceGraphic" in2="diff" operator="arithmetic" k1="1" k2="0" k3="0" k4="0" result="lit"/>
      <feComposite in="lit" in2="specIn" operator="arithmetic" k1="0" k2="1" k3=".55" k4="0"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#sky)"/>
  <rect x="0" y="372" width="512" height="10" fill="#c7d2fe" filter="url(#glow)"/>
  <rect x="0" y="374" width="512" height="5" fill="#eef2ff"/>

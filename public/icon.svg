<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c5654f"/><stop offset=".45" stop-color="#e2765a"/><stop offset=".62" stop-color="#f59e7b"/><stop offset=".74" stop-color="#8b7fa8"/><stop offset="1" stop-color="#3d3a5c"/>
    </linearGradient>
    <linearGradient id="face" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#e4dcef"/>
    </linearGradient>
    <filter id="glow" x="-10%" y="-400%" width="120%" height="900%"><feGaussianBlur stdDeviation="7"/></filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="8" stdDeviation="7" flood-color="#4a2030" flood-opacity=".45"/></filter>
    <filter id="emboss" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="5" result="blur"/>
      <feSpecularLighting in="blur" surfaceScale="7" specularConstant="1" specularExponent="18" lighting-color="#ffffff" result="spec"><fePointLight x="120" y="-160" z="320"/></feSpecularLighting>
      <feComposite in="spec" in2="SourceAlpha" operator="in" result="specIn"/>
